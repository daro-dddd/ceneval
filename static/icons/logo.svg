<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Sereno Petróleo Pastel (Cero Morado) -->
    <linearGradient id="bgPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162634" />
      <stop offset="60%" stop-color="#0f1b26" />
      <stop offset="100%" stop-color="#091118" />
    </linearGradient>

    <!-- Gradiente Pastel Cielo a Menta -->
    <linearGradient id="skyMintPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Gradiente Pastel Menta a Mar -->
    <linearGradient id="mintSeaPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Gradiente Pastel Durazno Suave -->
    <linearGradient id="peachPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <filter id="pastelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Marco redondeado en tonos pizarra/petróleo -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgPastel)" stroke="#22394c" stroke-width="4"/>

  <!-- Halo sutil menta pastel -->
  <circle cx="256" cy="235" r="140" fill="#6ee7b7" opacity="0.10" filter="url(#pastelGlow)"/>

  <!-- Libro / Código en tonos pastel -->
  <!-- Ala Izquierda (Azul Cielo Pastel) -->
  <path d="M256,160 C210,135 150,135 110,148 C104,150 100,156 100,162 L100,320 C100,328 106,334 114,333 C150,322 205,322 250,344 Z" 
        fill="none" stroke="url(#skyMintPastel)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ala Derecha (Verde Menta Pastel) -->
  <path d="M256,160 C302,135 362,135 402,148 C408,150 412,156 412,162 L412,320 C412,328 406,334 398,333 C362,322 307,322 262,344 Z" 
        fill="none" stroke="url(#mintSeaPastel)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Columna central en cielo pastel -->
  <line x1="256" y1="160" x2="256" y2="344" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round"/>

  <!-- Corchetes de código en tonos pastel < / > -->
  <!-- < (Cielo Pastel) -->
  <path d="M190,205 L155,235 L190,265" fill="none" stroke="#7dd3fc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- / (Durazno Pastel) -->
  <line x1="240" y1="270" x2="272" y2="200" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>

  <!-- > (Menta Pastel) -->
  <path d="M322,205 L357,235 L322,265" fill="none" stroke="#6ee7b7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Estrella dorada pastel (+) -->
  <g transform="translate(256, 105)">
    <path d="M0,-24 L6,-6 L24,0 L6,6 L0,24 L-6,6 L-24,0 L-6,-6 Z" fill="url(#peachPastel)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Tipografía EGEL⁺ ISOFT -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="44" font-weight="800" letter-spacing="8" fill="#f0f7f9" text-anchor="middle">EGEL<tspan fill="#6ee7b7">⁺</tspan></text>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" font-weight="600" letter-spacing="4" fill="#7e9aa8" text-anchor="middle">ISOFT • SIMULADOR</text>
</svg>
